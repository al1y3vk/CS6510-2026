# Edge router on :8080 so the load client still sees one base URL. Routes by path prefix only;
# the services never call each other (or the gateway).
worker_processes auto;
events { worker_connections 8192; }

http {
    access_log off;

    # keepalive: reuse upstream connections instead of a TCP handshake per proxied request
    upstream catalog   { server 127.0.0.1:8081; keepalive 32; }
    upstream checkout  { server 127.0.0.1:8082; keepalive 256; }
    upstream inventory { server 127.0.0.1:8083; keepalive 32; }
    upstream analytics { server 127.0.0.1:8084; keepalive 32; }

    server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        location = /items      { proxy_pass http://catalog; }
        location /transactions { proxy_pass http://checkout; }
        location /inventory/   { proxy_pass http://inventory; }
        location /analytics/   { proxy_pass http://analytics; }
    }
}
